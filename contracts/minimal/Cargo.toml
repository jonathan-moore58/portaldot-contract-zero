[package]
name = "portaldot-minimal"
version = "0.1.0"
edition = "2021"
publish = false
description = "Raw seal0 contract for PortalDot pallet-contracts 3.0.0 — no ink!, no dependencies"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# No dependencies. On purpose.
# The ecosystem's blocker is a dependency-resolution failure in the 2021-era
# cargo-contract; a contract with zero dependencies cannot hit it.
[dependencies]

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
overflow-checks = false
debug = false
strip = true
